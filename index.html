<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Shooter 3D - Fase Final</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; user-select: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.8); transition: opacity 0.2s; }
        
        #blood-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 40%, rgba(200,0,0,0.6) 100%); opacity: 0; transition: opacity 0.1s; pointer-events: none; z-index: 5; }
        
        #hud-bottom { position: absolute; bottom: 30px; right: 40px; display: flex; flex-direction: column; align-items: flex-end; text-shadow: 2px 2px 2px #000; }
        #ammo { font-size: 3.5rem; color: #fff; font-weight: bold; }
        #ammo-label { font-size: 1rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
        
        #health-bar-container { position: absolute; bottom: 30px; left: 40px; width: 250px; height: 15px; background: rgba(0,0,0,0.5); border: 2px solid #555; }
        #health-bar { width: 100%; height: 100%; background: #00ff55; transition: width 0.2s, background-color 0.2s; }
        
        #wave-ui { position: absolute; top: 20px; left: 40px; font-size: 2rem; color: #fff; font-weight: bold; text-shadow: 2px 2px 2px #000; }
        #kill-feed { position: absolute; top: 20px; right: 40px; color: #ff4444; font-weight: bold; font-size: 1.5rem; text-shadow: 2px 2px 2px black; font-style: italic; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 20; transition: opacity 0.3s; }
        .instructions { margin-top: 20px; color: #ccc; text-align: center; line-height: 1.8; font-size: 1.1rem; }
        span.key { background: #333; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #555; }
    </style>
</head>
<body>
    <div id="menu">
        <h1 id="menu-title" style="margin:0; font-size: 4rem; color: #ff3333; text-transform: uppercase;">Supervivencia</h1>
        <p style="font-size: 1.2rem; color: #aaa;">Haz clic para empezar</p>
        <div class="instructions">
            Sobrevive a todas las oleadas posibles.<br><br>
            <span class="key">W A S D</span> Moverse | <span class="key">Clic Izq</span> Disparar | <span class="key">Clic Der</span> Apuntar | <span class="key">R</span> Recargar
        </div>
    </div>
    
    <div id="blood-screen"></div>
    <div id="ui">
        <div id="crosshair"></div>
        <div id="wave-ui">OLEADA 1</div>
        <div id="kill-feed"></div>
        <div id="hud-bottom"><div id="ammo">30 / 30</div><div id="ammo-label">Munición</div></div>
        <div id="health-bar-container"><div id="health-bar"></div></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        // ==========================================
        // 1. SINTETIZADOR DE AUDIO (Web Audio API)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'empty') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        // ==========================================
        // 2. MOTOR GRÁFICO Y FÍSICO
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a10);
        scene.fog = new THREE.FogExp2(0x0a0a10, 0.025);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        scene.add(camera);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.2));
        const moonLight = new THREE.DirectionalLight(0x88bbff, 0.8);
        moonLight.position.set(50, 100, 50); moonLight.castShadow = true; scene.add(moonLight);
        const redNeon = new THREE.PointLight(0xff2222, 100, 30); redNeon.position.set(0, 5, 0); scene.add(redNeon);

        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -18, 0) });
        const defaultMat = new CANNON.Material();
        world.addContactMaterial(new CANNON.ContactMaterial(defaultMat, defaultMat, { friction: 0.3, restitution: 0.0 }));

        const hitTargets = [];
        function createBlock(w, h, d, x, y, z, color, isObstacle=false) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 }));
            mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0, shape: shape, material: defaultMat });
            body.position.set(x, y, z); world.addBody(body);
            if(isObstacle) hitTargets.push(mesh);
        }

        // Mapa Base
        createBlock(100, 1, 100, 0, -0.5, 0, 0x1a1a25); 
        createBlock(100, 10, 2, 0, 5, -50, 0x2a2a35, true); createBlock(100, 10, 2, 0, 5, 50, 0x2a2a35, true);
        createBlock(2, 10, 100, -50, 5, 0, 0x2a2a35, true); createBlock(2, 10, 100, 50, 5, 0, 0x2a2a35, true);
        for(let i=0; i<15; i++) createBlock(3, Math.random()*3+2, 3, (Math.random()-0.5)*70, 1.5, (Math.random()-0.5)*70, 0x666666, true);

        // ==========================================
        // 3. JUGADOR Y ARMA
        // ==========================================
        let playerHealth = 100; let isDead = false;
        const uiHealthBar = document.getElementById('health-bar');
        const bloodScreen = document.getElementById('blood-screen');
        const menuTitle = document.getElementById('menu-title');

        const weaponGroup = new THREE.Group();
        const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.6), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 }));
        barrel.position.set(0, 0, -0.3); weaponGroup.add(barrel);
        weaponGroup.position.set(0.25, -0.2, -0.4); camera.add(weaponGroup);

        // Flash de disparo (Muzzle Flash)
        const muzzleFlash = new THREE.PointLight(0xffaa00, 0, 5);
        muzzleFlash.position.set(0, 0, -0.7); weaponGroup.add(muzzleFlash);

        const playerBody = new CANNON.Body({ mass: 75, shape: new CANNON.Sphere(0.6), material: defaultMat, fixedRotation: true, linearDamping: 0.9 });
        playerBody.position.set(0, 5, 0); world.addBody(playerBody);

        const controls = new PointerLockControls(camera, document.body);
        const menu = document.getElementById('menu');
        menu.addEventListener('click', () => { if(isDead) location.reload(); else { audioCtx.resume(); controls.lock(); }});
        controls.addEventListener('lock', () => menu.style.display = 'none');
        controls.addEventListener('unlock', () => { if(!isDead) menu.style.display = 'flex'; });

        // ==========================================
        // 4. PARTÍCULAS
        // ==========================================
        const particles = [];
        const particleGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
        
        function spawnParticles(position, color, count) {
            const pMat = new THREE.MeshBasicMaterial({ color: color });
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(particleGeo, pMat);
                p.position.copy(position);
                scene.add(p);
                particles.push({
                    mesh: p,
                    velocity: new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10, (Math.random()-0.5)*10),
                    life: 1.0
                });
            }
        }

        // ==========================================
        // 5. SISTEMA DE OLEADAS Y RAGDOLL
        // ==========================================
        const enemies = [];
        let currentWave = 0;
        const waveUI = document.getElementById('wave-ui');
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xaa0000, roughness: 0.5 });

        function spawnRagdollEnemy() {
            const x = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 20);
            const z = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 20);

            const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 1), enemyMat.clone());
            torsoMesh.castShadow = true; scene.add(torsoMesh);
            const torsoBody = new CANNON.Body({ mass: 40, shape: new CANNON.Box(new CANNON.Vec3(0.5, 0.6, 0.5)), material: defaultMat, fixedRotation: true, linearDamping: 0.9 });
            torsoBody.position.set(x, 1.5, z); world.addBody(torsoBody);

            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), enemyMat.clone());
            headMesh.castShadow = true; scene.add(headMesh);
            const headBody = new CANNON.Body({ mass: 10, shape: new CANNON.Box(new CANNON.Vec3(0.3, 0.3, 0.3)), material: defaultMat, fixedRotation: true });
            headBody.position.set(x, 2.5, z); world.addBody(headBody);

            const neckJoint = new CANNON.LockConstraint(torsoBody, headBody);
            world.addConstraint(neckJoint);

            const enemyData = { torsoMesh, torsoBody, headMesh, headBody, neckJoint, hp: 100, isDead: false, lastHitTime: 0 };
            torsoMesh.userData = { parent: enemyData, type: 'torso' };
            headMesh.userData = { parent: enemyData, type: 'head' };
            
            hitTargets.push(torsoMesh, headMesh);
            enemies.push(enemyData);
        }

        function checkWave() {
            const aliveEnemies = enemies.filter(e => !e.isDead).length;
            if (aliveEnemies === 0 && !isDead) {
                currentWave++;
                waveUI.innerText = `OLEADA ${currentWave}`;
                waveUI.style.color = '#00ffaa';
                setTimeout(() => waveUI.style.color = '#ffffff', 1000);
                
                const enemiesToSpawn = 3 + (currentWave * 2);
                for(let i=0; i<enemiesToSpawn; i++) spawnRagdollEnemy();
            }
        }
        checkWave(); // Iniciar primera oleada

        // ==========================================
        // 6. COMBATE Y DISPARO
        // ==========================================
        let ammo = 30; const maxAmmo = 30; let isAiming = false; let isReloading = false;
        const uiAmmo = document.getElementById('ammo'); const killFeed = document.getElementById('kill-feed');
        
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('mousedown', (e) => { if(!controls.isLocked) return; if(e.button===2) isAiming=true; if(e.button===0) shoot(); });
        document.addEventListener('mouseup', (e) => { if (e.button === 2) isAiming = false; });

        const raycaster = new THREE.Raycaster();
        function shoot() {
            if (isReloading || isDead) return;
            if (ammo <= 0) { playSound('empty'); reload(); return; }
            
            ammo--; uiAmmo.innerText = `${ammo} / ${maxAmmo}`; 
            weaponGroup.position.z += 0.1; // Retroceso visual
            playSound('shoot');
            
            // Efecto Muzzle Flash
            muzzleFlash.intensity = 150;
            setTimeout(() => muzzleFlash.intensity = 0, 50);

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(hitTargets);
            
            if (intersects.length > 0) {
                const target = intersects[0].object;
                const point = intersects[0].point;
                
                if (target.userData && target.userData.parent && !target.userData.parent.isDead) {
                    const enemy = target.userData.parent;
                    const isHeadshot = target.userData.type === 'head';
                    
                    playSound('hit');
                    spawnParticles(point, 0xff0000, 15); // Sangre
                    enemy.hp -= isHeadshot ? 100 : 35; 
                    
                    enemy.torsoMesh.material.color.setHex(0xffffff); enemy.headMesh.material.color.setHex(0xffffff);
                    setTimeout(() => { if(!enemy.isDead){ enemy.torsoMesh.material.color.setHex(0xaa0000); enemy.headMesh.material.color.setHex(0xaa0000); } }, 100);
                    
                    if (enemy.hp <= 0 && !enemy.isDead) {
                        enemy.isDead = true;
                        enemy.torsoMesh.material.color.setHex(0x330000); enemy.headMesh.material.color.setHex(0x330000);
                        killFeed.innerText = isHeadshot ? "¡TIRO A LA CABEZA!" : "BAJA";
                        setTimeout(() => killFeed.innerText = "", 2000);
                        
                        enemy.torsoBody.fixedRotation = false; enemy.headBody.fixedRotation = false;
                        enemy.torsoBody.updateMassProperties(); enemy.headBody.updateMassProperties();
                        world.removeConstraint(enemy.neckJoint);
                        
                        const impactForce = isHeadshot ? 150 : 250;
                        const forceVec = new THREE.Vector3(0, 0, -impactForce).applyQuaternion(camera.quaternion);
                        const bodyToHit = isHeadshot ? enemy.headBody : enemy.torsoBody;
                        bodyToHit.applyImpulse(new CANNON.Vec3(forceVec.x, forceVec.y + 50, forceVec.z), bodyToHit.position);
                        
                        setTimeout(checkWave, 1000); // Comprobar si la oleada terminó
                    }
                } else {
                    spawnParticles(point, 0xffcc00, 5); // Chispas en pared
                }
            }
        }

        function reload() {
            if(isReloading || ammo === maxAmmo) return;
            isReloading = true; uiAmmo.innerText = `...`; weaponGroup.position.y -= 0.5; 
            setTimeout(() => { ammo = maxAmmo; uiAmmo.innerText = `${ammo} / ${maxAmmo}`; isReloading = false; }, 1500);
        }

        const keys = { w: false, a: false, s: false, d: false, space: false };
        document.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; if(e.code==='Space') keys.space=true; if(e.key.toLowerCase()==='r') reload(); });
        document.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; if(e.code==='Space') keys.space=false; });
        let canJump = false; playerBody.addEventListener("collide", (e) => { if(e.contact.ni.y > 0.5) canJump = true; });

        // ==========================================
        // 7. BUCLE PRINCIPAL
        // ==========================================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            world.step(1 / 60, delta, 3);

            // Actualizar Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= delta;
                if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); continue; }
                p.velocity.y -= 20 * delta; // Gravedad
                p.mesh.position.addScaledVector(p.velocity, delta);
                p.mesh.scale.setScalar(p.life); // Hacerse pequeñas
            }

            // IA Enemigos y Daño
            enemies.forEach(enemy => {
                enemy.torsoMesh.position.copy(enemy.torsoBody.position);
                enemy.torsoMesh.quaternion.copy(enemy.torsoBody.quaternion);
                enemy.headMesh.position.copy(enemy.headBody.position);
                enemy.headMesh.quaternion.copy(enemy.headBody.quaternion);
                
                if (!enemy.isDead && controls.isLocked && !isDead) {
                    const dir = new THREE.Vector3().subVectors(playerBody.position, enemy.torsoBody.position);
                    const distance = dir.length();
                    dir.y = 0; dir.normalize();
                    
                    const speed = 250 + (currentWave * 20); // Enemigos más rápidos cada oleada
                    enemy.torsoBody.force.x = dir.x * speed;
                    enemy.torsoBody.force.z = dir.z * speed;

                    if (distance < 2.5 && time - enemy.lastHitTime > 1.0) {
                        enemy.lastHitTime = time;
                        playSound('hit');
                        playerHealth -= 15;
                        uiHealthBar.style.width = Math.max(0, playerHealth) + '%';
                        if(playerHealth <= 30) uiHealthBar.style.backgroundColor = '#ff0000';
                        
                        bloodScreen.style.opacity = '1';
                        setTimeout(() => { if(!isDead) bloodScreen.style.opacity = '0'; }, 300);
                        playerBody.applyImpulse(new CANNON.Vec3(dir.x * 200, 50, dir.z * 200), playerBody.position);

                        if(playerHealth <= 0) {
                            isDead = true;
                            controls.unlock();
                            menu.style.display = 'flex';
                            menu.style.backgroundColor = 'rgba(100,0,0,0.9)';
                            menuTitle.innerText = "HAS MUERTO";
                            menu.querySelector('.instructions').innerText = `Sobreviviste hasta la OLEADA ${currentWave}\n\nHaz clic para reiniciar.`;
                        }
                    }
                }
            });

            // Actualizar Jugador
            camera.fov += ((isAiming ? 45 : 75) - camera.fov) * 15 * delta; camera.updateProjectionMatrix();
            weaponGroup.position.lerp(isAiming ? new THREE.Vector3(0, -0.13, -0.3) : new THREE.Vector3(0.25, -0.2, -0.4), 15 * delta);
            crosshair.style.opacity = isAiming ? '0' : '0.8';

            camera.position.set(playerBody.position.x, playerBody.position.y + 1.7, playerBody.position.z);

            if (controls.isLocked && !isDead) {
                const forward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); forward.y=0; forward.normalize();
                const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion); right.y=0; right.normalize();
                const moveDir = new THREE.Vector3();
                if(keys.w) moveDir.add(forward); if(keys.s) moveDir.sub(forward); if(keys.a) moveDir.sub(right); if(keys.d) moveDir.add(right);
                moveDir.normalize();
                if(moveDir.lengthSq() > 0) { playerBody.force.x = moveDir.x * 600; playerBody.force.z = moveDir.z * 600; }
                if(keys.space && canJump) { playerBody.velocity.y = 8; canJump = false; }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
