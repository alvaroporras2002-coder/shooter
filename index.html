<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Shooter 3D - Fase 2</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; user-select: none; }
        /* Interfaz de Usuario (HUD) */
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.8); transition: opacity 0.2s; }
        
        /* Contadores de HUD */
        #hud-bottom { position: absolute; bottom: 30px; right: 40px; display: flex; flex-direction: column; align-items: flex-end; text-shadow: 2px 2px 2px #000; }
        #ammo { font-size: 3rem; color: #fff; font-weight: bold; }
        #ammo-label { font-size: 1rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
        
        #health-bar-container { position: absolute; bottom: 30px; left: 40px; width: 250px; height: 15px; background: rgba(0,0,0,0.5); border: 2px solid #555; }
        #health-bar { width: 100%; height: 100%; background: #00ff55; transition: width 0.2s; }

        /* Menú de inicio */
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 20; transition: opacity 0.3s; }
        .instructions { margin-top: 20px; color: #ccc; text-align: center; line-height: 1.8; font-size: 1.1rem; }
        span.key { background: #333; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #555; }
    </style>
</head>
<body>
    <div id="menu">
        <h1 style="margin:0; font-size: 3rem; color: #ff3333; text-transform: uppercase;">Fase 2: Armas Activas</h1>
        <p style="font-size: 1.2rem;">Haz clic para entrar a la arena</p>
        <div class="instructions">
            <span class="key">W A S D</span> Movimiento | <span class="key">SHIFT</span> Correr | <span class="key">C</span> Agacharse / Deslizar | <span class="key">ESPACIO</span> Saltar<br><br>
            <span class="key">Clic Izq</span> Disparar | <span class="key">Clic Der</span> Apuntar (ADS) | <span class="key">R</span> Recargar
        </div>
    </div>
    
    <div id="ui">
        <div id="crosshair"></div>
        <div id="hud-bottom">
            <div id="ammo">30 / 30</div>
            <div id="ammo-label">Munición</div>
        </div>
        <div id="health-bar-container"><div id="health-bar"></div></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        // ==========================================
        // 1. MOTOR GRÁFICO BASE
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 10, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        scene.add(camera); // Necesario al añadirle objetos hijos (el arma)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ==========================================
        // 2. FÍSICAS Y MAPA (Reutilizado de Fase 1)
        // ==========================================
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -18, 0) });
        const defaultMaterial = new CANNON.Material("default");
        world.addContactMaterial(new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, { friction: 0.2, restitution: 0.0 }));

        // Suelo
        const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.9 }));
        floorMesh.rotation.x = -Math.PI / 2; floorMesh.receiveShadow = true; scene.add(floorMesh);
        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: defaultMaterial });
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0); world.addBody(floorBody);

        // Bloques colisionables (Guardados en un array para los impactos de bala)
        const hitTargets = [];
        const boxMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.7 });
        for(let i = 0; i < 20; i++) {
            const size = { w: Math.random()*3+1, h: Math.random()*4+1, d: Math.random()*3+1 };
            const boxMesh = new THREE.Mesh(new THREE.BoxGeometry(size.w, size.h, size.d), boxMat);
            boxMesh.castShadow = true; boxMesh.receiveShadow = true;
            
            const boxBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(size.w/2, size.h/2, size.d/2)) });
            const pos = { x: (Math.random()-0.5)*80, y: size.h/2, z: (Math.random()-0.5)*80 };
            
            boxMesh.position.set(pos.x, pos.y, pos.z); boxBody.position.set(pos.x, pos.y, pos.z);
            scene.add(boxMesh); world.addBody(boxBody);
            hitTargets.push(boxMesh); // Añadir a la lista de objetivos para el raycaster
        }

        // ==========================================
        // 3. CONSTRUCCIÓN DEL ARMA (Modelado procedural)
        // ==========================================
        const weaponGroup = new THREE.Group();
        
        // Cañón
        const barrelGeo = new THREE.BoxGeometry(0.05, 0.05, 0.6);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.position.set(0, 0, -0.3);
        barrel.castShadow = true;
        weaponGroup.add(barrel);

        // Cuerpo del arma
        const bodyGeo = new THREE.BoxGeometry(0.1, 0.15, 0.4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const weaponBody = new THREE.Mesh(bodyGeo, bodyMat);
        weaponBody.position.set(0, -0.05, 0);
        weaponGroup.add(weaponBody);

        // Mira (Punto rojo)
        const sightGeo = new THREE.BoxGeometry(0.02, 0.06, 0.02);
        const sightMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000 });
        const sight = new THREE.Mesh(sightGeo, sightMat);
        sight.position.set(0, 0.06, -0.1);
        weaponGroup.add(sight);

        // Posiciones del arma
        const hipPosition = new THREE.Vector3(0.25, -0.2, -0.4); // Posición desde la cadera
        const adsPosition = new THREE.Vector3(0, -0.13, -0.3);    // Posición al apuntar
        weaponGroup.position.copy(hipPosition);
        camera.add(weaponGroup); // Anclar arma a la cámara

        // ==========================================
        // 4. JUGADOR Y ESTADO DE ARMA
        // ==========================================
        const playerBody = new CANNON.Body({ mass: 75, shape: new CANNON.Sphere(0.6), material: defaultMaterial, fixedRotation: true, linearDamping: 0.9 });
        playerBody.position.set(0, 5, 0); world.addBody(playerBody);

        const controls = new PointerLockControls(camera, document.body);
        const menu = document.getElementById('menu');

        menu.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => menu.style.display = 'none');
        controls.addEventListener('unlock', () => menu.style.display = 'flex');

        // Variables de Juego
        let isAiming = false;
        let ammo = 30;
        const maxAmmo = 30;
        let isReloading = false;
        let recoilActive = 0;
        
        const uiAmmo = document.getElementById('ammo');
        const crosshair = document.getElementById('crosshair');

        // Controles de ratón y arma
        document.addEventListener('contextmenu', e => e.preventDefault()); // Evitar menú de clic derecho
        
        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            if (e.button === 2) isAiming = true; // Clic Derecho: Apuntar
            if (e.button === 0 && !isReloading) shoot(); // Clic Izquierdo: Disparar
        });
        
        document.addEventListener('mouseup', (e) => {
            if (e.button === 2) isAiming = false;
        });

        // ==========================================
        // 5. SISTEMA HITSCAN (Disparos)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        
        function shoot() {
            if (ammo <= 0) { reload(); return; }
            ammo--;
            uiAmmo.innerText = `${ammo} / ${maxAmmo}`;
            
            // Efecto de retroceso (Recoil)
            recoilActive = 0.15; // Duración del retroceso
            
            // Disparo desde el centro de la pantalla
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects([floorMesh, ...hitTargets]);

            if (intersects.length > 0) {
                const hitPoint = intersects[0].point;
                const hitNormal = intersects[0].face.normal;

                // Crear marca de impacto (Decal/Chispa temporal)
                const sparkGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
                const spark = new THREE.Mesh(sparkGeo, sparkMat);
                spark.position.copy(hitPoint);
                scene.add(spark);

                // Eliminar la marca después de un segundo
                setTimeout(() => scene.remove(spark), 1000);
            }
        }

        function reload() {
            if(isReloading || ammo === maxAmmo) return;
            isReloading = true;
            uiAmmo.innerText = `Recargando...`;
            
            // Animación básica de recarga bajando el arma
            weaponGroup.position.y -= 0.5; 
            
            setTimeout(() => {
                ammo = maxAmmo;
                uiAmmo.innerText = `${ammo} / ${maxAmmo}`;
                isReloading = false;
            }, 1500);
        }

        // ==========================================
        // 6. CONTROLES DE MOVIMIENTO BÁSICOS
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false, shift: false, c: false, space: false };
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = true;
            if(e.code === 'Space') keys.space = true;
            if(key === 'r') reload();
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = false;
            if(e.code === 'Space') keys.space = false;
        });

        let canJump = false;
        playerBody.addEventListener("collide", (e) => { if(e.contact.ni.y > 0.5) canJump = true; });

        // ==========================================
        // 7. BUCLE PRINCIPAL (Animaciones fluidas)
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            world.step(1 / 60, delta, 3);

            // Interpolación de ADS (Aim Down Sights)
            const targetFOV = isAiming ? 45 : 75;
            camera.fov += (targetFOV - camera.fov) * 12 * delta; // Acercar zoom suavemente
            camera.updateProjectionMatrix();

            const targetPos = isAiming ? adsPosition : hipPosition;
            weaponGroup.position.lerp(targetPos, 15 * delta); // Mover arma al centro
            
            // Ocultar retícula al apuntar
            crosshair.style.opacity = isAiming ? '0' : '0.8';

            // Animación de Retroceso (Recoil)
            if (recoilActive > 0) {
                recoilActive -= delta;
                weaponGroup.position.z += 1.5 * delta; // Empuje hacia atrás
                camera.rotation.x += 0.2 * delta; // Patada vertical
            }

            // Movimiento del jugador
            let targetHeight = keys.c ? 0.8 : 1.7;
            camera.position.x = playerBody.position.x;
            camera.position.z = playerBody.position.z;
            camera.position.y += (playerBody.position.y + targetHeight - camera.position.y) * 12 * delta;

            if (controls.isLocked) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); right.y = 0; right.normalize();

                const moveDir = new THREE.Vector3();
                if (keys.w) moveDir.add(forward);
                if (keys.s) moveDir.sub(forward);
                if (keys.a) moveDir.sub(right);
                if (keys.d) moveDir.add(right);
                moveDir.normalize();

                let currentForce = keys.shift ? 1100 : (keys.c ? 300 : 600);
                if (moveDir.lengthSq() > 0) {
                    playerBody.force.x = moveDir.x * currentForce;
                    playerBody.force.z = moveDir.z * currentForce;
                }

                if (keys.space && canJump) { playerBody.velocity.y = 8; canJump = false; }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
